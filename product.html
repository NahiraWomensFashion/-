<style>
:root{--wine:#5A1827;--gold:#D4AF37;--champ:#f6e3b8;--txt:#f3e8dc;--mut:rgba(243,232,220,.72);
--serif:"Cormorant Garamond","Playfair Display",Palatino,"Palatino Linotype","Book Antiqua",Georgia,serif;
--sans:"Avenir Next","Segoe UI",Helvetica,Arial,sans-serif;--spring:cubic-bezier(.34,1.56,.64,1);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-family:var(--sans);background:#1b0a11;color:var(--txt);line-height:1.65;overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:
radial-gradient(640px 520px at 6% 14%,rgba(212,175,55,.10),transparent 62%),
radial-gradient(720px 600px at 96% 34%,rgba(176,58,98,.20),transparent 62%),
radial-gradient(700px 600px at 18% 88%,rgba(122,34,56,.30),transparent 62%),
linear-gradient(180deg,#1b0a11,#260e18 50%,#170810)}
a{color:inherit;text-decoration:none}
button,select{font-family:inherit}
a,button{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
::selection{background:rgba(212,175,55,.4);color:#fff}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px;width:100%}
main{flex:1;padding:128px 0 84px}
.skip{position:fixed;left:12px;top:-60px;z-index:100;padding:10px 18px;border-radius:999px;background:var(--gold);color:#2a0c14;transition:top .3s}
.skip:focus{top:12px}

/* navigation */
#nav{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(1120px,calc(100% - 24px));z-index:50;display:flex;align-items:center;justify-content:space-between;padding:10px 20px;border-radius:999px;color:#fff;
background:linear-gradient(135deg,rgba(32,10,17,.9),rgba(26,8,14,.84));backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);border:1px solid rgba(212,175,55,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 32px rgba(0,0,0,.4)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-size:1.5rem;letter-spacing:.22em}
.brand svg{width:42px;height:42px}
.links{display:flex;gap:26px;font-size:.92rem;letter-spacing:.06em}
.links a{display:inline-block;padding:12px 6px;opacity:.92;transition:transform .45s var(--spring),color .3s,opacity .3s}
.links a:hover,.links a:focus-visible,.links a[aria-current=page]{color:#f6dd92;opacity:1}
.links a:hover{transform:translateY(-2px) scale(1.12)}
.burger{display:none;width:44px;height:44px;margin-right:-8px;place-items:center;font-size:1.5rem;line-height:1;border-radius:50%;background:none;border:0;color:#fff;cursor:pointer}
@media(max-width:760px){
.burger{display:grid}
.links{position:absolute;top:calc(100% + 10px);left:0;right:0;flex-direction:column;gap:0;border-radius:24px;padding:8px 24px;background:rgba(26,8,14,.97);border:1px solid rgba(212,175,55,.35);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(-8px);transition:opacity .4s,transform .4s,visibility 0s .4s}
.links.open{opacity:1;visibility:visible;pointer-events:auto;transform:none;transition-delay:0s}
.links a{padding:14px 0;border-bottom:1px solid rgba(212,175,55,.15)}
.links a:last-child{border:0}
.links a:hover{transform:none}}

/* page heading */
.crumbs{display:flex;flex-wrap:wrap;gap:0 10px;align-items:center;font-size:.86rem;color:var(--mut);margin-bottom:14px}
.crumbs a{display:inline-flex;align-items:center;min-height:44px;color:var(--champ);transition:color .3s}
.crumbs a:hover{color:var(--gold)}
.crumbs i{font-style:normal;opacity:.45}
.kicker{color:var(--gold);letter-spacing:.14em;font-size:.8rem;font-weight:600;text-transform:uppercase}
.title{font-family:var(--serif);font-weight:500;line-height:1.1;font-size:clamp(2.2rem,5.5vw,3.8rem);margin-top:8px;padding-bottom:.08em;
background:linear-gradient(100deg,#fff2d2 5%,#e8c46a 55%,#d98aa0 108%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lead{max-width:640px;margin-top:14px;color:var(--mut)}
.orn{display:flex;align-items:center;gap:12px;color:var(--gold);margin-top:18px}
.orn i{height:1px;width:56px;background:linear-gradient(90deg,transparent,var(--gold))}
.orn i:last-child{transform:scaleX(-1)}

/* buttons + light sweep */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:13px 28px;border-radius:999px;font-size:.95rem;letter-spacing:.05em;cursor:pointer;text-align:center;
border:1px solid var(--gold);color:var(--champ);background:rgba(255,255,255,.06);transition:transform .45s var(--spring),box-shadow .4s,background .4s,color .4s}
.btn:hover{transform:translateY(-3px)}
.b-gold{background:linear-gradient(135deg,#f3d98b,#D4AF37 55%,#a97f28);color:#2a0c14;border-color:rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 8px 24px rgba(212,175,55,.28)}
.b-wa{background:linear-gradient(135deg,#27c765,#188f48);border-color:rgba(255,255,255,.3);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 28px rgba(24,143,72,.3)}
.b-line:hover{background:var(--gold);color:#2a0c14}
.sw{position:relative;overflow:hidden}
.sw::after,.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:3;background:linear-gradient(135deg,transparent 46.5%,rgba(255,238,196,.34) 50%,transparent 53.5%);background-size:300% 300%;background-position:0 0;transition:background-position 1.15s cubic-bezier(.45,0,.2,1)}
.sw:hover::after,.btn:hover::after{background-position:100% 100%}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));backdrop-filter:blur(20px) saturate(140%);-webkit-backdrop-filter:blur(20px) saturate(140%);border:1px solid rgba(212,175,55,.28);box-shadow:0 14px 40px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.16),inset 0 -1px 0 rgba(212,175,55,.12)}

/* picture + product cards */
.media{position:relative;aspect-ratio:4/5;overflow:hidden;background:radial-gradient(circle at 70% 18%,rgba(255,255,255,.18),transparent 55%),linear-gradient(160deg,var(--c1,#7a2238),var(--c2,#2c0c16))}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.ph{position:absolute;inset:0;display:grid;place-items:center}
.ph span{display:grid;place-items:center;width:96px;height:96px;border-radius:50%;color:#f6dd92;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.28),rgba(255,255,255,.06) 70%);border:1px solid rgba(246,221,146,.55);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 12px 30px rgba(0,0,0,.35)}
.ph svg{width:52px;height:52px}
.badge{position:absolute;top:12px;left:12px;z-index:2;padding:5px 14px;border-radius:999px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,rgba(255,255,255,.28),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.5);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:22px}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.ph span{width:72px;height:72px}.ph svg{width:38px;height:38px}}
@media(max-width:360px){.grid{grid-template-columns:1fr}}
.pc{display:flex;flex-direction:column;border-radius:22px;border:1px solid rgba(212,175,55,.3);background:linear-gradient(135deg,rgba(255,255,255,.10),rgba(255,255,255,.03));box-shadow:0 14px 40px rgba(0,0,0,.38);animation:up .8s both;transition:transform .5s var(--spring),box-shadow .5s,border-color .5s}
.mwrap{position:relative}
.pi{padding:16px 18px 18px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcat{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.pi h3{font-family:var(--serif);font-weight:500;font-size:1.3rem;line-height:1.2;color:var(--champ)}
.pp{font-weight:600;color:#f6dd92}
.pp s{color:var(--mut);font-weight:400;font-size:.88em;margin-left:6px}
.vd{margin-top:12px;align-self:flex-start;display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:999px;border:1px solid var(--gold);color:var(--champ);font-size:.88rem;letter-spacing:.05em;transition:background .4s,color .4s}
@media(max-width:560px){.pi{padding:12px 12px 14px}.pi h3{font-size:1.1rem}.vd{align-self:stretch;justify-content:center;padding:0 10px}}
@media(hover:hover){
.pc:hover{transform:translateY(-8px) scale(1.02);border-color:rgba(246,221,146,.7);box-shadow:0 28px 60px rgba(0,0,0,.55),0 0 30px rgba(212,175,55,.18)}
.pc:hover .media img{transform:scale(1.07)}
.pc:hover .vd{background:var(--gold);color:#2a0c14}}

/* messages */
.state{max-width:620px;margin:40px auto 0;padding:40px 28px;border-radius:24px;text-align:center}
.state svg{width:46px;height:46px;color:var(--gold);margin-bottom:14px}
.state h2{font-family:var(--serif);font-weight:500;font-size:1.8rem;color:var(--champ);line-height:1.2}
.state p{margin:10px 0 22px;color:var(--mut)}
.state .row{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}

/* footer + whatsapp button */
footer{background:linear-gradient(160deg,#2a0c14,#120509 75%);border-top:1px solid rgba(212,175,55,.3);color:#e8d9c8;text-align:center;padding:56px 20px 36px}
.fe{width:52px;height:52px;margin:0 auto 12px;display:block}
.motto{font-family:var(--serif);font-size:clamp(.95rem,4.2vw,1.9rem);letter-spacing:.2em;padding-left:.2em;background:linear-gradient(90deg,#f6dd92,#D4AF37,#f6dd92);-webkit-background-clip:text;background-clip:text;color:transparent}
@media(min-width:561px){.motto{letter-spacing:.3em;padding-left:.3em}}
.fl{display:flex;gap:0 20px;justify-content:center;flex-wrap:wrap;margin:18px 0;font-size:.9rem}
.fl a{padding:12px 6px;transition:color .3s}.fl a:hover{color:var(--gold)}
.fp{font-size:.9rem}.fp a{display:inline-block;padding:10px 4px}
.copy{font-size:.8rem;opacity:.65;border-top:1px solid rgba(212,175,55,.25);padding-top:22px;margin-top:10px}
.fab{position:fixed;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;width:60px;height:60px;border-radius:50%;background:#1fa855;display:grid;place-items:center;color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.28);animation:pulse 2.6s infinite;transition:transform .5s var(--spring)}
.fab:hover{transform:scale(1.08)}.fab svg{width:30px;height:30px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(31,168,85,.55)}70%{box-shadow:0 0 0 18px rgba(31,168,85,0)}100%{box-shadow:0 0 0 0 rgba(31,168,85,0)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}}
.up{animation:up .9s both}
@media(max-width:560px){footer{padding-bottom:100px}main{padding-top:112px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}

.pd{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:44px;align-items:start;margin-top:10px}
@media(max-width:900px){.pd{grid-template-columns:minmax(0,1fr);gap:26px}}
.big{border-radius:24px;border:1px solid rgba(212,175,55,.4);box-shadow:0 18px 44px rgba(0,0,0,.42)}
.big .ph span{width:128px;height:128px}.big .ph svg{width:70px;height:70px}
.thumbs{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.thumbs button{width:68px;height:84px;border-radius:12px;overflow:hidden;padding:0;cursor:pointer;border:1px solid rgba(212,175,55,.4);background:none}
.thumbs button[aria-current=true]{border-color:var(--gold);box-shadow:0 0 0 2px rgba(212,175,55,.35)}
.thumbs .media{aspect-ratio:auto;height:100%}
.pbadge{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:999px;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);border:1px solid rgba(212,175,55,.5);background:rgba(212,175,55,.08);transition:background .4s,color .4s}
.pbadge:hover{background:var(--gold);color:#2a0c14}
.info .title{font-size:clamp(2rem,4.6vw,3rem)}
.price{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-top:14px;font-family:var(--serif);font-size:2rem;color:#f6dd92;line-height:1.2}
.price s{font-size:1.2rem;color:var(--mut)}.price small{font-family:var(--sans);font-size:.8rem;letter-spacing:.08em;color:var(--gold);padding:3px 10px;border:1px solid rgba(212,175,55,.5);border-radius:999px}
.note{margin-top:6px;color:var(--mut);font-size:.9rem}
.desc{margin-top:18px;color:var(--txt)}
.fab-line{margin-top:14px;font-size:.92rem;color:var(--mut)}.fab-line b{color:#f6dd92;font-weight:600}
.det{list-style:none;margin-top:14px;display:grid;gap:6px}
.det li{display:flex;gap:10px;color:var(--mut);font-size:.94rem}.det li::before{content:"\2726";color:var(--gold);flex:none}
.opt{margin-top:26px}
.lab{display:block;font-size:.74rem;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
.sizes{display:flex;flex-wrap:wrap;gap:10px}
.sz{min-width:56px;min-height:48px;padding:0 18px;border-radius:14px;border:1px solid rgba(212,175,55,.45);background:rgba(255,255,255,.06);color:var(--txt);font-size:.95rem;cursor:pointer;transition:transform .4s var(--spring),background .3s,color .3s,border-color .3s}
.sz:hover{transform:translateY(-3px);border-color:var(--gold)}
.sz[aria-checked=true]{background:linear-gradient(135deg,#f3d98b,#D4AF37 55%,#a97f28);color:#2a0c14;border-color:rgba(255,255,255,.4);font-weight:600}
.sizes.bad{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.hint{margin-top:10px;font-size:.88rem;color:var(--mut)}.hint a{color:#f6dd92;text-decoration:underline;text-underline-offset:3px}
.err{min-height:1.4em;margin-top:8px;font-size:.88rem;color:#ff9fb0}
.qty{display:inline-flex;align-items:center;border-radius:999px;border:1px solid rgba(212,175,55,.45);background:rgba(255,255,255,.06)}
.qty button{width:48px;height:48px;border:0;background:none;color:var(--champ);font-size:1.4rem;line-height:1;cursor:pointer;border-radius:50%;transition:background .3s,transform .4s var(--spring)}
.qty button:hover:not(:disabled){background:rgba(212,175,55,.22);transform:scale(1.12)}
.qty button:disabled{opacity:.35;cursor:not-allowed}
.qty output{min-width:48px;text-align:center;font-size:1.1rem;font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-top:26px;padding:16px 20px;border-radius:16px}
.total span{color:var(--mut);font-size:.9rem}.total b{font-family:var(--serif);font-size:1.7rem;font-weight:500;color:#f6dd92}
.buy{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.buy .btn{width:100%;min-height:56px;font-size:1rem}
.pickup{margin-top:22px;padding:18px 20px;border-radius:18px;font-size:.9rem;color:var(--mut)}
.pickup b{display:block;color:var(--champ);font-family:var(--serif);font-weight:500;font-size:1.2rem;margin-bottom:4px}
.pickup a{color:#f6dd92;text-decoration:underline;text-underline-offset:3px}
.rel{margin-top:72px}
@media(max-width:560px){.rel .pc:nth-child(3){display:none}}
.rel h2{font-family:var(--serif);font-weight:500;font-size:clamp(1.7rem,4vw,2.4rem);color:var(--champ);margin-bottom:22px}
</style>

<a class="fab" id="fab" href="https://wa.me/919116639756" target="_blank" rel="noopener" aria-label="Chat on WhatsApp"><svg viewBox="0 0 24 24" fill="currentColor"><use href="#wa"/></svg></a>

<script src="products.js"></script>
<script>
(function(){
"use strict";
var N=window.NAHIRA; if(!N){ document.getElementById('app').innerHTML='<div class="state glass"><h2>We could not load the catalogue</h2><p>Please refresh the page, or message us on WhatsApp and we will help you right away.</p><div class="row"><a class="btn b-wa" href="https://wa.me/919116639756">Chat on WhatsApp</a></div></div>'; return; }
N.initShell();
var app=document.getElementById("app"), C=N.config, E=N.esc;
var params=new URLSearchParams(location.search);
var id=(params.get("id")||"").trim();
var p=id?N.product(id):null;

function missing(title,text){
  document.title=title+" | NAHIRA Women\u2019s Fashion";
  app.innerHTML='<div class="state glass up">'+N.icon("gem")+'<h2>'+E(title)+'</h2><p>'+E(text)+'</p><div class="row"><a class="btn b-gold" href="collections.html">Browse collections</a>'+
    '<a class="btn b-wa" target="_blank" rel="noopener" href="'+E(N.wa("Hello Nahira Fashion, I could not find a product on your website. Could you help me?"))+'">Ask on WhatsApp</a></div></div>';
}
if(!id){ missing("No piece selected","Please choose a piece from one of our collections."); return; }
if(!p){ missing("We could not find that piece","It may have been sold or the link may be old. Our collections have many more beautiful pieces."); return; }

var cat=N.cat(p.category)||{name:"Collection",id:""};
var sizes=N.sizesFor(p), sold=p.inStock===false;
var state={size:null,qty:1};
var imgs=(p.images||[]).filter(Boolean);

document.title=p.name+" | NAHIRA Women\u2019s Fashion, Udaipur";
var md=document.querySelector('meta[name="description"]'); if(md) md.setAttribute("content",(p.description||p.name).slice(0,155));
document.getElementById("crumbs").insertAdjacentHTML("beforeend",
  '<i>&rsaquo;</i><a href="category.html?cat='+encodeURIComponent(cat.id)+'">'+E(cat.name)+'</a><i>&rsaquo;</i><span aria-current="page">'+E(p.name)+'</span>');

/* search-engine data */
try{ var ld={"@context":"https://schema.org","@type":"Product",name:p.name,description:p.description||p.name,category:cat.name,
  offers:{"@type":"Offer",priceCurrency:"INR",price:p.price||undefined,availability:sold?"https://schema.org/OutOfStock":"https://schema.org/InStock"}};
  if(imgs.length) ld.image=imgs;
  var s=document.createElement("script"); s.type="application/ld+json"; s.textContent=JSON.stringify(ld); document.head.appendChild(s);}catch(e){}

var disc=(p.mrp>p.price&&p.price>0)?Math.round((1-p.price/p.mrp)*100):0;
var thumbs=imgs.length>1?'<div class="thumbs" role="group" aria-label="Product photos">'+imgs.map(function(src,i){
  return '<button type="button" data-i="'+i+'" aria-label="Photo '+(i+1)+'"'+(i===0?' aria-current="true"':'')+'>'+N.media(p,"",i)+'</button>';}).join("")+'</div>':'';

app.innerHTML=
'<div class="pd">'+
  '<div class="gal up"><div class="mwrap" id="main">'+N.media(p,"big")+((sold||p.badge)?'<span class="badge">'+E(sold?"Sold out":p.badge)+'</span>':'')+'</div>'+thumbs+'</div>'+
  '<div class="info up" style="animation-delay:.1s">'+
    '<a class="pbadge" href="category.html?cat='+encodeURIComponent(cat.id)+'">'+E(cat.name)+'</a>'+
    '<h1 class="title">'+E(p.name)+'</h1>'+
    '<div class="price"><span>'+E(N.price(p.price))+'</span>'+(p.mrp>p.price?'<s>'+E(N.price(p.mrp))+'</s>':'')+(disc?'<small>'+disc+'% OFF</small>':'')+'</div>'+
    (p.note?'<p class="note">'+E(p.note)+'</p>':'')+
    '<p class="desc">'+E(p.description||"")+'</p>'+
    (p.fabric?'<p class="fab-line">Fabric: <b>'+E(p.fabric)+'</b></p>':'')+
    ((p.details&&p.details.length)?'<ul class="det">'+p.details.map(function(d){return '<li>'+E(d)+'</li>';}).join("")+'</ul>':'')+
    (sizes?'<div class="opt"><span class="lab" id="szl">Select size</span><div class="sizes" id="sizes" role="radiogroup" aria-labelledby="szl">'+
      sizes.map(function(s){return '<button type="button" class="sz" role="radio" aria-checked="false" data-s="'+E(s)+'">'+E(s)+'</button>';}).join("")+'</div>'+
      '<p class="hint" id="cust" hidden>Custom size: we will take your measurements at the boutique or on WhatsApp. <a href="index.html#tailoring">See Custom Tailoring</a></p>'+
      '<p class="err" id="err" role="alert"></p></div>':'')+
    (p.tailoringHint?'<p class="hint">Want it stitched? <a href="index.html#tailoring">Explore Custom Tailoring &rarr;</a></p>':'')+
    '<div class="opt"><span class="lab" id="ql">Quantity</span><div class="qty" role="group" aria-labelledby="ql"><button type="button" id="minus" aria-label="Decrease quantity">&minus;</button><output id="qv" aria-live="polite">1</output><button type="button" id="plus" aria-label="Increase quantity">+</button></div></div>'+
    '<div class="total glass"><span>Total</span><b id="tot"></b></div>'+
    '<div class="buy"><a class="btn b-wa" id="order" target="_blank" rel="noopener" href="#">'+(sold?"Ask about similar pieces":"Reserve / Order on WhatsApp")+'</a>'+
      '<a class="btn b-line" href="tel:'+E(C.phoneTel)+'">Call '+E(C.phoneDisplay)+'</a></div>'+
    '<div class="pickup glass"><b>Boutique pickup, Udaipur</b>Reserve on WhatsApp and collect from our boutique. We will confirm availability and a pickup time with you. <a href="'+E(C.mapLink)+'" target="_blank" rel="noopener">Open in Google Maps</a></div>'+
  '</div>'+
'</div>';

/* gallery */
var main=document.getElementById("main");
Array.prototype.forEach.call(document.querySelectorAll(".thumbs button"),function(b){
  b.addEventListener("click",function(){
    var i=+b.dataset.i, badge=main.querySelector(".badge");
    main.innerHTML=N.media(p,"big",i)+(badge?badge.outerHTML:"");
    Array.prototype.forEach.call(document.querySelectorAll(".thumbs button"),function(x){ x.setAttribute("aria-current",String(x===b)); });
  });
});

/* size / quantity / order */
var order=document.getElementById("order"), tot=document.getElementById("tot"), qv=document.getElementById("qv");
var plus=document.getElementById("plus"), minus=document.getElementById("minus"), err=document.getElementById("err"), cust=document.getElementById("cust");

function message(){
  var unit=p.price>0?p.price:0, total=unit*state.qty, L=[];
  if(sold){
    return "Hello Nahira Fashion, I saw \""+p.name+"\" on your website. Is it available again, or do you have similar pieces?";
  }
  L.push("*NAHIRA FASHION | Boutique Reservation*","","Hello Nahira Fashion, I would like to reserve the following piece:","",
    "*Product:* "+p.name,"*Category:* "+cat.name);
  if(sizes) L.push("*Size:* "+(state.size==="Custom"?"Custom (measurements to follow)":state.size));
  L.push("*Quantity:* "+state.qty);
  L.push("*Price:* "+(unit?(N.price(unit)+(state.qty>1?" each | Total "+N.price(total):"")):"Price on request"));
  L.push("*Reference:* "+p.id);
  if(/^https?:/.test(location.protocol)) L.push("*Link:* "+location.origin+location.pathname+"?id="+encodeURIComponent(p.id));
  L.push("","*Pickup:* NAHIRA boutique, Udaipur ("+C.coords+")","Map: "+C.mapLink,"",
    "Please confirm availability and a convenient pickup time. Thank you!");
  return L.join("\n");
}
function update(){
  qv.textContent=state.qty; minus.disabled=state.qty<=1; plus.disabled=state.qty>=C.maxQty;
  tot.textContent=p.price>0?N.price(p.price*state.qty):"Price on request";
  if(cust) cust.hidden=state.size!=="Custom";
  order.href=N.wa(message());
}
Array.prototype.forEach.call(document.querySelectorAll(".sz"),function(b){
  b.addEventListener("click",function(){
    state.size=b.dataset.s; err.textContent="";
    Array.prototype.forEach.call(document.querySelectorAll(".sz"),function(x){ x.setAttribute("aria-checked",String(x===b)); });
    update();
  });
});
minus.addEventListener("click",function(){ if(state.qty>1){ state.qty--; update(); } });
plus.addEventListener("click",function(){ if(state.qty<C.maxQty){ state.qty++; update(); } });
order.addEventListener("click",function(e){
  if(sizes&&!sold&&!state.size){
    e.preventDefault(); err.textContent="Please select a size to continue.";
    var g=document.getElementById("sizes"); g.classList.remove("bad"); void g.offsetWidth; g.classList.add("bad");
    g.scrollIntoView({block:"center",behavior:"smooth"}); var f=g.querySelector(".sz"); if(f) f.focus({preventScroll:true});
    return;
  }
  order.href=N.wa(message());
});
update();

/* related pieces */
var rel=N.inCat(p.category).filter(function(x){return x.id!==p.id;}).slice(0,3);
if(!rel.length) rel=N.products.filter(function(x){return x.id!==p.id&&N.cat(x.category)&&!N.cat(x.category).href;}).slice(0,3);
if(rel.length) app.insertAdjacentHTML("beforeend",'<section class="rel"><h2>You may also like</h2><div class="grid">'+rel.map(N.card).join("")+'</div></section>');
})();
</script>
</body>
</html>
