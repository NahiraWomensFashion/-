<script src="inventory.js"></script>
<script>
(function () {
"use strict";
var app=document.getElementById("app");
if(!window.NAHIRA){ if(app){ app.textContent=""; var d=document.createElement("div"); d.className="notice glass"; d.innerHTML='<h2>We could not load the catalogue</h2><p>Please refresh the page, or message us on WhatsApp and we will help you right away.</p><div class="notice-row"><a class="btn btn-wa" href="https://wa.me/919116639756">Chat on WhatsApp</a></div>'; app.appendChild(d);} return; }
var N=window.NAHIRA; var $=function(i){return document.getElementById(i);};
var C=N.config, E=N.esc;
var params=new URLSearchParams(location.search);
var id=(params.get("id")||"").trim();
var p=id?N.product(id):null;
var SHARE_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 10.5l6.8-4M8.6 13.5l6.8 4"/></svg>', RULER_ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 17l14-14 4 4L7 21H3z"/><path d="M13 7l2 2M10 10l2 2M7 13l2 2"/></svg>';

function missing(title,text){
  N.initShell();
  N.setMeta({title:title+" | NAHIRA Women\u2019s Fashion"});
  app.innerHTML='<div class="notice glass"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M32 6l7 16 17 2-13 11 4 17-15-9-15 9 4-17L8 24l17-2z"/></svg><h2>'+E(title)+'</h2><p>'+E(text)+'</p><div class="notice-row"><a class="btn btn-gold" href="collections.html">Browse collections</a>'+
    '<a class="btn btn-wa" target="_blank" rel="noopener" href="'+E(N.wa("Hello Nahira Fashion, I could not find a product on your website. Could you help me?"))+'">Ask on WhatsApp</a></div></div>';
}
if(!id){ missing("No piece selected","Please choose a piece from one of our collections."); return; }
if(!p){ missing("We could not find that piece","It may have been sold or the link may be old. Our collections have many more beautiful pieces."); return; }

var cat=N.cat(p.category)||{name:"Collection",id:""};
var sizes=N.sizesFor(p), sold=p.inStock===false, hasPrice=typeof p.price==="number"&&p.price>0;
var state={size:null,qty:1,unit:"in"};
var imgs=(p.images||[]).filter(Boolean);
var chart=(C.sizeChart||[]).filter(function(r){ return sizes&&sizes.indexOf(r.size)>=0; });
var tok=N.generateToken();
var pageUrl=N.abs("product-details.html?id="+encodeURIComponent(p.id));
var title=p.name+" | NAHIRA Women\u2019s Fashion, Udaipur";

/* link-preview + search-engine data */
N.setMeta({title:title,description:(p.description||p.name).slice(0,155),image:imgs[0],url:pageUrl});
try{
  var ld={"@context":"https://schema.org","@type":"Product",name:p.name,description:p.description||p.name,category:cat.name,sku:p.id,url:pageUrl};
  if(imgs.length) ld.image=imgs.map(function(s){ return N.abs(s); });
  if(hasPrice) ld.offers={"@type":"Offer",priceCurrency:"INR",price:p.price,availability:sold?"https://schema.org/OutOfStock":"https://schema.org/InStock"};
  var sc=document.createElement("script"); sc.type="application/ld+json"; sc.textContent=JSON.stringify(ld); document.head.appendChild(sc);
}catch(e){}

var crumbs=$("crumbs");
if(crumbs) crumbs.insertAdjacentHTML("beforeend",'<i>&rsaquo;</i><a href="products-list.html?cat='+encodeURIComponent(cat.id)+'">'+E(cat.name)+'</a><i>&rsaquo;</i><span aria-current="page">'+E(p.name)+'</span>');

var disc=(p.mrp>p.price&&hasPrice)?Math.round((1-p.price/p.mrp)*100):0;
var thumbs=imgs.length>1?'<div class="thumbs" role="group" aria-label="Product photos">'+imgs.map(function(src,i){
  return '<button type="button" data-i="'+i+'" aria-label="Photo '+(i+1)+' of '+imgs.length+'"'+(i===0?' aria-current="true"':'')+'>'+N.media(p,"",i)+'</button>';}).join("")+'</div>':'';
var priceHtml=hasPrice
  ? '<p class="pd-price">'+E(N.price(p.price))+(p.mrp>p.price?' <s class="pd-note">'+E(N.price(p.mrp))+'</s>':'')+(disc?' <span class="pd-note">'+disc+'% off</span>':'')+'</p>'
  : '<p class="pd-price">Price on request</p><p class="pd-note">Message us on WhatsApp for the price and availability.</p>';

app.innerHTML=
'<div class="pd">'+
  '<div class="rise pd-gallery"><div class="pd-main media-wrap" id="main-pic">'+N.media(p,"")+((sold||p.badge)?'<span class="media-badge">'+E(sold?"Sold out":p.badge)+'</span>':'')+'</div>'+thumbs+'</div>'+
  '<div class="pd-info rise" style="animation-delay:.1s">'+
    '<a class="pd-cat" href="products-list.html?cat='+encodeURIComponent(cat.id)+'">'+E(cat.name)+'</a>'+
    '<h1 class="title">'+E(p.name)+'</h1>'+
    priceHtml+
    (p.note?'<p class="pd-note">'+E(p.note)+'</p>':'')+
    '<p class="pd-desc">'+E(p.description||"")+'</p>'+
    (p.fabric?'<p class="pd-fabric">Fabric: <b>'+E(p.fabric)+'</b></p>':'')+
    ((p.details&&p.details.length)?'<ul class="pd-details">'+p.details.map(function(d){return '<li>'+E(d)+'</li>';}).join("")+'</ul>':'')+
    (sizes?'<div class="pd-opt"><div class="pd-labrow"><span class="pd-label" id="szl">Select size</span>'+
      (chart.length?'<button type="button" class="link-btn" id="sgOpen" aria-haspopup="dialog">'+RULER_ICON+'Size Guide</button>':'')+'</div>'+
      '<div class="size-list" id="sizes" role="radiogroup" aria-labelledby="szl">'+
      sizes.map(function(s){return '<button type="button" class="size-btn" role="radio" aria-checked="false" data-s="'+E(s)+'">'+E(s)+'</button>';}).join("")+'</div>'+
      '<p class="pd-hint" id="cust" hidden>Custom size: we will take your measurements at the boutique or on WhatsApp. <a href="index.html#tailoring">See Custom Tailoring</a></p>'+
      '<p class="pd-error" id="err" role="alert"></p></div>':'')+
    (p.tailoringHint?'<p class="pd-hint">Want it stitched? <a href="index.html#tailoring">Explore Custom Tailoring &rarr;</a></p>':'')+
    '<div class="pd-opt"><span class="pd-label" id="ql">Quantity</span><div class="stepper" role="group" aria-labelledby="ql"><button type="button" id="minus" aria-label="Decrease quantity">&minus;</button><output id="qv" aria-live="polite">1</output><button type="button" id="plus" aria-label="Increase quantity">+</button></div></div>'+
    '<div class="pd-actions"><a class="btn btn-wa btn-block" id="order" target="_blank" rel="noopener" href="'+E(N.wa("Hello Nahira Fashion, I would like to ask about "+p.name+"."))+'">'+(sold?"Ask about similar pieces":"Reserve / Order on WhatsApp")+'</a>'+
      '<p class="pd-note" id="tokNote">Order token: <b class="num" id="tokVal"></b>. It is added to your WhatsApp message.</p>'+
      '<button type="button" class="btn btn-line btn-block" id="shareBtn">'+SHARE_ICON+'Share this piece</button>'+
      '<a class="btn btn-line btn-block" href="tel:'+E(C.phoneTel)+'">Call '+E(C.phoneDisplay)+'</a></div>'+
    '<div class="pickup-card glass"><b>Boutique pickup, Udaipur</b>Reserve on WhatsApp and collect from our boutique. We will confirm availability and a pickup time with you.'+
      '<p class="hrs">Boutique Timings: '+E(C.hours||"")+'</p><p><a href="'+E(C.mapLink)+'" target="_blank" rel="noopener">Open in Google Maps</a></p></div>'+
  '</div>'+
'</div>';

/* ---------- gallery ---------- */
var mainPic=$("main-pic");
[].forEach.call(document.querySelectorAll(".thumbs button"),function(b){
  b.addEventListener("click",function(){
    var badge=mainPic.querySelector(".media-badge");
    mainPic.innerHTML=N.media(p,"",+b.dataset.i)+(badge?badge.outerHTML:"");
    [].forEach.call(document.querySelectorAll(".thumbs button"),function(x){ x.setAttribute("aria-current",String(x===b)); });
  });
});

/* ---------- size / quantity / order ---------- */
var order=$("order"), qv=$("qv"), plus=$("plus"), minus=$("minus"), err=$("err"), cust=$("cust"), tokVal=$("tokVal");
function message(){
  if(sold) return "Hello Nahira Fashion, I saw \""+p.name+"\" on your website ("+pageUrl+"). Is it available again, or do you have similar pieces?";
  var facts=[["Product",p.name],["Category",cat.name]];
  if(sizes) facts.push(["Size",state.size==="Custom"?"Custom (measurements to follow)":(state.size||"Not selected")]);
  facts.push(["Quantity",String(state.qty)]);
  facts.push(["Price",hasPrice?(N.price(p.price)+(state.qty>1?" each | Total "+N.price(p.price*state.qty):"")):"Price on request"]);
  return N.orderMessage({title:"Boutique Reservation",token:tok,intro:"Hello Nahira Fashion, I would like to reserve the following piece:",facts:facts,sku:p.id,url:pageUrl});
}
function paint(){
  if(qv) qv.textContent=state.qty;
  if(minus) minus.disabled=state.qty<=1;
  if(plus) plus.disabled=state.qty>=C.maxQty;
  if(cust) cust.hidden=state.size!=="Custom";
  [].forEach.call(document.querySelectorAll(".size-btn"),function(x){ x.setAttribute("aria-checked",String(x.dataset.s===state.size)); });
  if(tokVal) tokVal.textContent=tok;
  if(order) order.href=N.wa(message());
}
function pick(s){ state.size=s; if(err) err.textContent=""; paint(); }
[].forEach.call(document.querySelectorAll(".size-btn"),function(b){ b.addEventListener("click",function(){ pick(b.dataset.s); }); });
if(minus) minus.addEventListener("click",function(){ if(state.qty>1){ state.qty--; paint(); } });
if(plus) plus.addEventListener("click",function(){ if(state.qty<C.maxQty){ state.qty++; paint(); } });
if(order) order.addEventListener("click",function(e){
  if(sizes&&!sold&&!state.size){
    e.preventDefault(); if(err) err.textContent="Please select a size to continue.";
    var g=$("sizes"); if(g){ g.classList.remove("is-bad"); void g.offsetWidth; g.classList.add("is-bad"); g.scrollIntoView({block:"center",behavior:"smooth"}); var f=g.querySelector(".size-btn"); if(f) f.focus({preventScroll:true}); }
    return;
  }
  order.href=N.wa(message());                                  /* this order uses the current token ... */
  setTimeout(function(){ tok=N.generateToken(); paint(); },900);  /* ... the next one gets a fresh token */
});

/* ---------- share ---------- */
var shareBtn=$("shareBtn");
if(shareBtn) shareBtn.addEventListener("click",function(){
  N.share({title:p.name+" | NAHIRA",text:"Hey! Look at this gorgeous piece from NAHIRA Boutique: "+p.name+". What do you think about this? "+pageUrl});
});
paint();

/* ---------- size guide popup (Inches / cm, one-tap size, keyboard focus trap) ---------- */
var sgOpen=$("sgOpen"), modal=null, lastFocus=null;
function cm(v){ return Math.round(v*2.54); }
function sgPaint(){
  var f=function(v){ return state.unit==="in"?v+"\u2033":String(cm(v)); };
  modal.querySelector("tbody").innerHTML=chart.map(function(r){
    return '<tr'+(state.size===r.size?' class="is-on"':'')+'><td><button type="button" class="size-pick" data-s="'+E(r.size)+'" aria-label="Select size '+E(r.size)+'">'+E(r.size)+'</button></td><td>'+f(r.bust)+'</td><td>'+f(r.waist)+'</td><td>'+f(r.hip)+'</td></tr>';
  }).join("");
  [].forEach.call(modal.querySelectorAll(".unit-toggle button"),function(b){ b.setAttribute("aria-pressed",String(b.dataset.u===state.unit)); });
  modal.querySelector(".unit-cap").textContent=state.unit==="in"?"Measurements in inches":"Measurements in centimetres";
}
function sgClose(){
  if(!modal||!modal.classList.contains("is-open")) return;
  modal.classList.remove("is-open"); modal.setAttribute("aria-hidden","true");
  document.documentElement.style.overflow=""; document.body.style.overflow="";
  if(lastFocus&&lastFocus.focus) lastFocus.focus({preventScroll:true});
}
function sgShow(){
  if(!modal){
    modal=document.createElement("div"); modal.className="modal"; modal.setAttribute("aria-hidden","true");
    modal.innerHTML='<div class="modal-back" data-close="1"></div><div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="sgT" tabindex="-1">'+
      '<button type="button" class="modal-close" data-close="1" aria-label="Close size guide">&times;</button>'+
      '<h2 id="sgT">Size Guide</h2><p class="modal-sub">Standard body measurements. Tap a size to select it.</p>'+
      '<div class="unit-toggle" role="group" aria-label="Measurement unit"><button type="button" data-u="in">Inches</button><button type="button" data-u="cm">cm</button></div>'+
      '<table class="size-table"><thead><tr><th scope="col">Size</th><th scope="col">Bust</th><th scope="col">Waist</th><th scope="col">Hip</th></tr><tr><th class="unit-cap" colspan="4"></th></tr></thead><tbody></tbody></table>'+
      '<p class="modal-note">Between sizes, or want a perfect fit? Choose <b>Custom</b> and we will stitch to your exact measurements. <a href="index.html#tailoring">Custom Tailoring</a></p></div>';
    document.body.appendChild(modal);
    modal.addEventListener("click",function(e){
      var t=e.target; if(!t.closest) return;
      if(t.closest("[data-close]")){ sgClose(); return; }
      var u=t.closest(".unit-toggle button"); if(u){ state.unit=u.dataset.u; sgPaint(); return; }
      var s=t.closest(".size-pick"); if(s){ pick(s.dataset.s); sgClose(); var b=document.querySelector('.size-btn[data-s="'+s.dataset.s+'"]'); if(b) b.focus({preventScroll:true}); }
    });
  }
  sgPaint(); modal.classList.add("is-open"); modal.setAttribute("aria-hidden","false");
  document.documentElement.style.overflow="hidden"; document.body.style.overflow="hidden";
  setTimeout(function(){ var x=modal.querySelector(".modal-close"); if(x) x.focus({preventScroll:true}); },40);
}
if(sgOpen) sgOpen.addEventListener("click",function(){ lastFocus=sgOpen; sgShow(); });
document.addEventListener("keydown",function(e){
  if(!modal||!modal.classList.contains("is-open")) return;
  if(e.key==="Escape"){ e.preventDefault(); sgClose(); return; }
  if(e.key==="Tab"){
    var f=[].slice.call(modal.querySelectorAll("button")).filter(function(b){ return b.offsetParent!==null||b===document.activeElement; });
    if(!f.length) return; var first=f[0], last=f[f.length-1], box=modal.querySelector(".modal-box");
    if(e.shiftKey&&(document.activeElement===first||document.activeElement===box)){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); }
  }
});

/* ---------- related pieces (3 from the same category) ---------- */
var rel=N.inCat(p.category).filter(function(x){return x.id!==p.id;}).slice(0,3);
if(!rel.length) rel=N.shelf().filter(function(x){return x.id!==p.id;}).slice(0,3);
if(rel.length) app.insertAdjacentHTML("beforeend",'<section class="related" aria-labelledby="relT"><h2 id="relT">You may also like</h2><div class="grid-prod">'+rel.map(N.card).join("")+'</div></section>');

N.initShell();
})();
</script>
