<style>

background:linear-gradient(135deg,rgba(32,10,17,.9),rgba(26,8,14,.84));backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%);border:1px solid rgba(212,175,55,.38);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 32px rgba(0,0,0,.4)}

<script>
(function(){
"use strict";
var N=window.NAHIRA; if(!N){ document.getElementById('app').innerHTML='<div class="state glass"><h2>We could not load the catalogue</h2><p>Please refresh the page, or message us on WhatsApp and we will help you right away.</p><div class="row"><a class="btn b-wa" href="https://wa.me/919116639756">Chat on WhatsApp</a></div></div>'; return; }
N.initShell();
var app=document.getElementById("app"), $=function(id){return document.getElementById(id);};
var params=new URLSearchParams(location.search);
var raw=(params.get("cat")||"all").trim().toLowerCase();
var shelf=N.categories.filter(function(c){return !c.href;});
var cat=raw==="all"?null:shelf.filter(function(c){return c.id.toLowerCase()===raw;})[0];

function state(title,text,extra){
  app.innerHTML='<div class="state glass up">'+N.icon("gem")+'<h2>'+N.esc(title)+'</h2><p>'+N.esc(text)+'</p><div class="row">'+extra+'</div></div>';
}
function chipsHtml(){
  var all='<a class="chip" href="category.html?cat=all"'+(cat?'':' aria-current="true"')+'>All</a>';
  return all+shelf.map(function(c){
    var on=cat&&cat.id===c.id;
    return '<a class="chip" href="category.html?cat='+encodeURIComponent(c.id)+'"'+(on?' aria-current="true"':'')+'>'+N.esc(c.name)+'</a>';
  }).join("");
}

if(raw!=="all"&&!cat){
  document.title="Collection not found | NAHIRA Women\u2019s Fashion";
  $("kick").textContent="Collection not found"; $("ttl").textContent="We could not find that collection";
  $("lead").textContent="The link may be old or mistyped. Please choose one of our collections below.";
  state("Choose a collection","Here are the collections currently available at NAHIRA.",
    shelf.map(function(c){return '<a class="btn b-line" href="category.html?cat='+encodeURIComponent(c.id)+'">'+N.esc(c.name)+'</a>';}).join("")+'<a class="btn b-gold" href="collections.html">All collections</a>');
  return;
}

var name=cat?cat.name:"All Pieces";
document.title=name+" | NAHIRA Women\u2019s Fashion, Udaipur";
$("kick").textContent=cat?(cat.tagline||"The Collection"):"The Collection";
$("ttl").textContent=name;
$("lead").textContent=cat?(cat.description||""):"Every piece in our boutique, in one place. Choose a collection to narrow it down.";
$("crumbs").insertAdjacentHTML("beforeend",'<i>&rsaquo;</i><span aria-current="page">'+N.esc(name)+'</span>');
$("chips").innerHTML=chipsHtml(); $("toolbar").hidden=false;

var items=cat?N.inCat(cat.id):N.products.filter(function(p){return N.cat(p.category)&&!N.cat(p.category).href;});

function render(){
  var mode=$("sort").value, list=items.slice();
  if(mode==="low") list.sort(function(a,b){return (a.price||0)-(b.price||0);});
  if(mode==="high") list.sort(function(a,b){return (b.price||0)-(a.price||0);});
  if(mode==="name") list.sort(function(a,b){return String(a.name).localeCompare(String(b.name));});
  $("count").textContent=list.length+(list.length===1?" piece":" pieces");
  if(!list.length){
    $("sort").disabled=true;
    state("New pieces arriving soon","We are adding new designs to this collection. Message us and we will tell you what is coming.",
      '<a class="btn b-wa" target="_blank" rel="noopener" href="'+N.esc(N.wa("Hello Nahira Fashion, I would like to know about new arrivals in "+name+"."))+'">Ask on WhatsApp</a><a class="btn b-line" href="collections.html">All collections</a>');
    return;
  }
  app.innerHTML='<div class="grid">'+list.map(N.card).join("")+'</div>';
}
$("sort").addEventListener("change",render);
render();
})();
</script>
</body>
</html>
